pluginManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        gradlePluginPortal()
    }

    plugins {
        id 'java'
        id 'maven-publish'
        id 'net.covers1624.signing'          version '1.1.3'   apply false
        id 'net.neoforged.moddev'            version '2.0.77'  apply false
    }
}

rootProject.name = 'ProjectRed'

include 'api', 'core', 'expansion', 'exploration', 'fabrication', 'illumination', 'integration', 'transmission'

// Empty module for client/server run configurations
include 'runtime'
